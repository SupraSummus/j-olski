name: checks

#  Gałąź bez pull requesta przebiegu nie dostaje, bo minuty runnera liczą się
#  za każdy przebieg z osobna (CLAUDE.md, sekcja `Checks`).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

#  A branch here gets amended and force-pushed,
#  and the superseded run is measuring a commit that no longer exists.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          #  The floor `pyproject.toml` declares, so a change that outgrows it
          #  fails here rather than in somebody's install.
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: python3 -m pytest
      - run: ruff check .
      #  Plik bez wpisu w `REUSE.toml` wywraca ten krok, więc dane dopisane do
      #  drzewa bez deklaracji nie dojadą do wydania po cichu.
      - run: reuse lint
      #  Pinned, so a run goes red because somebody pushed something
      #  rather than because a linter shipped a new default rule.
      - run: npx --yes markdownlint-cli@0.45.0 '**/*.md'

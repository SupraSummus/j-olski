[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olski"
version = "0.0.1"
description = "A style linter for Polish technical documentation"
requires-python = ">=3.11"
dependencies = ["morfeusz2>=1.99"]

[project.optional-dependencies]
#  markdown-it-py is the calibration harness's parser rather than the linter's:
#  olski reads plain text and takes no view of a document format. It is declared
#  here because this is what the checks install, and harness/ is not a package
#  anybody installs.
dev = ["markdown-it-py>=3", "pytest>=8", "ruff>=0.5"]

[project.scripts]
olski = "olski.cli:main"
olski-check = "olski.check:main"
olski-corpus = "olski.coverage:main"

[tool.setuptools.packages.find]
include = ["olski*"]

#  Leksykon walencyjny jest danymi, a nie kodem, więc wchodzi do paczki stąd.
#  Gramatyka czyta go przy imporcie, więc instalacja bez niego nie startuje.
[tool.setuptools.package-data]
olski = ["leksykon.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
#  The calibration harness is not part of the linter and is not installed with
#  it, so its tests reach it the way a run from a clone does.
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olski"
version = "0.0.1"
description = "A parser for a designed subset of Polish"
requires-python = ">=3.11"
dependencies = ["morfeusz2>=1.99"]

[project.optional-dependencies]
#  markdown-it-py is the harness's parser rather than olski's: the grammar reads
#  plain text and takes no view of a document format. It is declared here because
#  this is what the checks install, and harness/ is not a package anybody
#  installs.
dev = ["markdown-it-py>=3", "pytest>=8", "ruff>=0.5"]
#  Serwer HTTP witryny, czyli jedyna zależność bocznego toru. Aplikacja jest
#  funkcją WSGI ze standardowej biblioteki, więc suita nie woła gunicorna, a
#  klon bez tego dodatku uruchamia witrynę przez `python3 -m witryna`.
witryna = ["gunicorn>=22"]

[project.scripts]
olski-check = "olski.check:main"
olski-pokrycie = "olski.pokrycie:main"

[tool.setuptools.packages.find]
include = ["olski*"]

#  Leksykon walencyjny jest danymi, a nie kodem, więc wchodzi do paczki stąd.
#  Gramatyka czyta go przy imporcie, więc instalacja bez niego nie startuje.
#  Tabela skłonności przyłączeniowych idzie tą samą drogą i z tym się różni, że
#  bez niej warstwa rozstrzygająca milczy, zamiast nie wstać.
#  Oba mówią o polszczyźnie, więc są te same dla każdego, kto olskiego zainstaluje.
#  Leksykon projektu tędy nie idzie i dlatego, że mówi o jednym projekcie:
#  `projekt.txt` leży w katalogu, nad którym olskiego uruchomiono
#  (`znajdź` w `olski/projekt.py`).
[tool.setuptools.package-data]
olski = ["leksykon.txt", "skłonności.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
#  The harness is not part of the package and is not installed with it, so its
#  tests reach it the way a run from a clone does.
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
